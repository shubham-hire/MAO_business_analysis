services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SOURCE_PROVIDER: ${SOURCE_PROVIDER:-offline}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_PROJECT_ID: ${TAVILY_PROJECT_ID:-}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-advanced}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-5}
      TAVILY_MAX_QUERIES_PER_STAGE: ${TAVILY_MAX_QUERIES_PER_STAGE:-2}
      TAVILY_TIMEOUT_SECONDS: ${TAVILY_TIMEOUT_SECONDS:-30}
      TAVILY_INCLUDE_RAW_CONTENT: ${TAVILY_INCLUDE_RAW_CONTENT:-true}
      MARKET_AGENT_MAX_ITERATIONS: ${MARKET_AGENT_MAX_ITERATIONS:-2}
      MARKET_AGENT_MAX_QUERIES: ${MARKET_AGENT_MAX_QUERIES:-4}
      MARKET_AGENT_MAX_MODEL_CALLS: ${MARKET_AGENT_MAX_MODEL_CALLS:-4}
      MARKET_AGENT_MAX_SOURCES: ${MARKET_AGENT_MAX_SOURCES:-10}
      MARKET_AGENT_TIMEOUT_SECONDS: ${MARKET_AGENT_TIMEOUT_SECONDS:-120}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_TIMEOUT_SECONDS: ${NVIDIA_TIMEOUT_SECONDS:-60}
      NVIDIA_MAX_RETRIES: ${NVIDIA_MAX_RETRIES:-2}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "4173:4173"
